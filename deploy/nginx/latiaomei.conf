# ═══════════════════════════════════════════════════════════════
# 辣条妹的御膳房 — https://latiaomei.infinityfly.xin
#
# 服务本身监听 127.0.0.1:18821，静态文件（web/）也由它托管，
# nginx 只负责：TLS、压缩、真实 IP 透传、请求体上限。
# 缓存头由 Go 侧按文件类型设置（见 httpapi.setStaticCache），nginx 不覆盖。
#
# 安装：
#   ln -sfn /data/www/latiaomei/deploy/nginx/latiaomei.conf /etc/nginx/conf.d/latiaomei.conf
#   nginx -t && systemctl reload nginx
# 证书（首次）：
#   certbot certonly --webroot -w /var/www/certbot -d latiaomei.infinityfly.xin
# ═══════════════════════════════════════════════════════════════

server {
    listen      80;
    listen      [::]:80;
    server_name latiaomei.infinityfly.xin;

    # 证书续期走的校验路径（certbot --webroot），必须留在 http 上
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name latiaomei.infinityfly.xin;

    ssl_certificate     /etc/letsencrypt/live/latiaomei.infinityfly.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/latiaomei.infinityfly.xin/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    access_log /var/log/nginx/latiaomei.access.log;
    error_log  /var/log/nginx/latiaomei.error.log warn;

    # 单图上传上限 6MB（LATIAOMEI_UPLOAD_MAX_MB），留出表单与重试余量
    client_max_body_size 10m;
    client_body_timeout  60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:18821;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # 服务只监听本机，因此这些头可以信任（见 httpapi.clientIP）
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
