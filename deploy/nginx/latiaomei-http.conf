# ═══════════════════════════════════════════════════════════════
# 辣条妹的御膳房 — http 版本（只监听 80）
#
# 什么时候用它：证书还没签下来的时候先让站点能开。
# 拿到证书后换成 latiaomei.conf（含 443 与 80 跳转）：
#   certbot certonly --webroot -w /var/www/certbot -d latiaomei.infinityfly.xin
#   ln -sfn /data/www/latiaomei/deploy/nginx/latiaomei.conf /etc/nginx/conf.d/latiaomei.conf
#   nginx -t && systemctl reload nginx
# 同时把 deploy/latiaomei.env 里的 LATIAOMEI_COOKIE_SECURE 改回 1 并重启服务：
# 不上 HTTPS 时 Cookie 不能要求 Secure，否则后台登录不上。
# ═══════════════════════════════════════════════════════════════

server {
    listen      80;
    listen      [::]:80;
    server_name latiaomei.infinityfly.xin;

    # 证书续期/首次签发的校验路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    charset utf-8;
    access_log /var/log/nginx/latiaomei.access.log;
    error_log  /var/log/nginx/latiaomei.error.log warn;

    client_max_body_size 10m;
    client_body_timeout  60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    location / {
        proxy_pass         http://127.0.0.1:18821;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
