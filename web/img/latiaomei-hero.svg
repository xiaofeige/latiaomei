<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 440" role="img" aria-label="辣条妹：戴大圆眼镜、系橙围裙，举锅铲指着镜头的贴纸风 IP">
  <!-- 贴纸风白描边（die-cut）：所有主体形先垫一层粗白边 -->
  <g stroke="#fff" stroke-width="16" stroke-linejoin="round" fill="#fff">
    <path d="M170 100 C120 100 96 138 100 186 C103 216 120 238 170 238 C220 238 237 216 240 186 C244 138 220 100 170 100 Z"/>
    <circle cx="106" cy="96" r="30"/><circle cx="234" cy="96" r="30"/>
    <path d="M96 236 C60 250 44 292 46 356 L294 356 C296 292 280 250 244 236 C226 260 114 260 96 236 Z"/>
  </g>

  <!-- 头发（后层）：辣油红棕 + 双丸子头 -->
  <g stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round">
    <circle cx="106" cy="96" r="27" fill="#C63A17"/>
    <circle cx="234" cy="96" r="27" fill="#C63A17"/>
    <!-- 丸子头黄皮筋 -->
    <rect x="88" y="114" width="36" height="10" rx="5" fill="#FFE926"/>
    <rect x="216" y="114" width="36" height="10" rx="5" fill="#FFE926"/>
    <path d="M170 84 C124 84 98 116 102 164 C104 186 112 200 118 208 C110 176 118 148 136 136 C130 156 132 176 140 190 C150 150 176 128 210 128 C228 128 240 144 242 164 C244 184 238 198 224 208 C240 200 246 180 246 160 C246 116 216 84 170 84 Z" fill="#C63A17"/>
  </g>

  <!-- 脸 -->
  <path d="M170 100 C124 100 102 134 106 182 C109 214 128 236 170 236 C212 236 231 214 234 182 C238 134 216 100 170 100 Z" fill="#FFE3C8" stroke="#1a1a1a" stroke-width="5"/>
  <!-- 刘海 -->
  <path d="M106 156 C108 118 132 98 170 98 C208 98 232 118 234 156 C226 132 210 122 196 124 C202 136 200 148 192 156 C184 132 168 122 150 126 C156 138 152 152 142 158 C136 138 122 138 112 150 Z" fill="#C63A17" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>

  <!-- 腮红 -->
  <circle cx="126" cy="196" r="9" fill="#FF8FB1" opacity=".85"/>
  <circle cx="214" cy="196" r="9" fill="#FF8FB1" opacity=".85"/>

  <!-- 大圆眼镜：白镜片黑粗框 -->
  <g stroke="#1a1a1a" stroke-width="6">
    <circle cx="142" cy="172" r="26" fill="#fff"/>
    <circle cx="198" cy="172" r="26" fill="#fff"/>
    <path d="M168 170 L172 170" stroke-width="6"/>
    <path d="M116 164 L104 158 M224 164 L236 158" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- 斗鸡眼斜视：两只瞳孔都往中间瞟，一大一小更呆 -->
  <circle cx="152" cy="174" r="7" fill="#1a1a1a"/>
  <circle cx="188" cy="174" r="9" fill="#1a1a1a"/>
  <circle cx="154" cy="171" r="2.2" fill="#fff"/>
  <circle cx="191" cy="170" r="2.6" fill="#fff"/>
  <!-- 挑眉：左低右高 -->
  <path d="M126 142 Q142 136 158 142" stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M182 140 Q198 128 214 136" stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- 坏笑嘴角 -->
  <path d="M150 210 Q170 224 192 206" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M192 206 Q196 203 197 199" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- 身体：白 T + 橙围裙 -->
  <g stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round">
    <path d="M96 236 C60 250 44 292 46 356 L294 356 C296 292 280 250 244 236 C226 260 114 260 96 236 Z" fill="#fff"/>
    <!-- 围裙主体 -->
    <path d="M118 262 C104 300 100 330 102 356 L238 356 C240 330 236 300 222 262 C200 276 140 276 118 262 Z" fill="#FF6A2A"/>
    <!-- 围裙颈带 -->
    <path d="M132 250 L146 268 M208 250 L194 268" stroke-width="6" fill="none"/>
    <!-- 围裙口袋 + 辣字 -->
    <rect x="142" y="300" width="56" height="40" rx="8" fill="#E85D1A" stroke-width="4"/>
    <text x="170" y="328" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="900" fill="#FFE926" stroke="none">辣</text>
  </g>

  <!-- 左手：捏着一根辣条 -->
  <g stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round">
    <path d="M78 262 Q58 286 60 316" stroke-width="16" fill="none" stroke-linecap="round" stroke="#1a1a1a"/>
    <path d="M78 262 Q58 286 60 316" stroke-width="9" fill="none" stroke-linecap="round" stroke="#FF6A2A"/>
    <circle cx="60" cy="320" r="12" fill="#FF6A2A"/>
    <rect x="46" y="330" width="12" height="34" rx="5" fill="#E85D1A" transform="rotate(-18 52 347)"/>
  </g>

  <!-- 右臂：举锅铲怼镜头（近大远小，铲面正对观众） -->
  <g stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round">
    <path d="M258 258 Q282 240 292 214" stroke-width="16" fill="none" stroke-linecap="round" stroke="#1a1a1a"/>
    <path d="M258 258 Q282 240 292 214" stroke-width="9" fill="none" stroke-linecap="round" stroke="#FF6A2A"/>
    <!-- 铲柄（从拳头往镜头方向延伸） -->
    <path d="M292 210 L304 158" stroke="#7a4a1e" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- 拳头 -->
    <circle cx="292" cy="214" r="14" fill="#FF6A2A"/>
    <!-- 铲面：怼到镜头前，故意画大 -->
    <g transform="rotate(8 300 128)">
      <rect x="262" y="92" width="76" height="58" rx="12" fill="#cfd2d6" stroke-width="6"/>
      <path d="M270 100 h60 M270 112 h60 M270 124 h60 M270 136 h60" stroke="#a6abb3" stroke-width="3"/>
      <rect x="288" y="146" width="24" height="10" rx="4" fill="#9aa0a8"/>
      <!-- 反光 -->
      <path d="M272 98 L284 96 L276 148 L266 144 Z" fill="#fff" opacity=".65" stroke="none"/>
    </g>
  </g>

  <!-- 贴纸点缀：荧光小元素 -->
  <g stroke="none" font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <path d="M40 120 L44 132 L56 136 L44 140 L40 152 L36 140 L24 136 L36 132 Z" fill="#E9FF3D" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M318 268 L321 276 L329 279 L321 282 L318 290 L315 282 L307 279 L315 276 Z" fill="#FF5CA8" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="36" cy="252" r="5" fill="#00E5FF" stroke="#1a1a1a" stroke-width="3"/>
    <text x="24" y="72" font-size="22" font-weight="900" fill="#E4002B" stroke="#1a1a1a" stroke-width="1" transform="rotate(-12 30 66)">开饭!</text>
  </g>
</svg>
